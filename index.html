<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat PWA</title>

<!-- Inline CSS -->
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 50px;
  background-color: #f0f0f0;
  color: #333;
  transition: background-color 0.3s, color 0.3s;
}
.container {
  max-width: 500px;
  margin: auto;
}
button {
  padding: 10px 20px;
  font-size: 18px;
  margin: 10px;
  cursor: pointer;
  border: none;
  border-radius: 5px;
  background-color: #4CAF50;
  color: white;
  transition: background-color 0.3s;
}
button:hover { background-color: #45a049; }
#installBtn { display: none; }
.dark-mode { background-color: #121212; color: #f0f0f0; }
</style>
</head>
<body>
<div class="container">
  <h1>Private Chat PWA</h1>
  <button id="clickBtn">Click Me</button>
  <button id="darkModeBtn">Toggle Dark Mode</button>
  <button id="installBtn">Install App</button>
  <p id="status">App is fully offline!</p>
</div>

<script>
// Button functionality
document.getElementById('clickBtn').addEventListener('click', () => {
  alert('Hello! This works offline!');
});
document.getElementById('darkModeBtn').addEventListener('click', () => {
  document.body.classList.toggle('dark-mode');
  document.getElementById('status').textContent = document.body.classList.contains('dark-mode') ? 'Dark Mode ON' : 'Dark Mode OFF';
});

// --------------------
// Install Button Logic
// --------------------
let deferredPrompt;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  // Prevent Chrome 67+ default mini-infobar
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'inline-block'; // Show install button
});

installBtn.addEventListener('click', async () => {
  installBtn.style.display = 'none';
  if (deferredPrompt) {
    deferredPrompt.prompt(); // Show native install prompt
    const { outcome } = await deferredPrompt.userChoice;
    console.log(`User response to install: ${outcome}`);
    deferredPrompt = null;
  }
});

// --------------------
// Inline manifest as JS Blob
// --------------------
const manifest = {
  "id": "/private-chat-app",
  "name": "Private Chat App",
  "short_name": "ChatApp",
  "description": "A secure offline-friendly chat app that works on mobile and desktop.",
  "start_url": "./",
  "display": "standalone",
  "background_color": "#ffffff",
  "theme_color": "#4CAF50",
  "icons": [
    {
      "src": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAYAAABzenr0AAABe0lEQVRYR+2VvQ2DMAyF3zJH6yZ7iBg0G+7B2Y30H1lBO0MVGvRSl5ZgDdw1XnQUY2Cw8V9wXLpQ4D0J0KYr8hOEHkqgQQn6wMc+J5izA6qZ5vBlDGzB06jYACw0AAazf9gOaOxzABzlyM6sABmQLgPONZ+BkywSAKy2CN/8ZwAyshLAr2/hY91AzgOQBb0JcYg3FZABOANqLhDg4MAQnwCk7AAHkkmFvP7yBsUHyZMP9yEQO6JXyW+ID5G8ZqVUgN3oXkMf8mS89N6qq2vG2jG2Y+02s62I0qG1ofRnLZf2cXKZv+VxoWkRRLOF4wlTQAipmJ+rnDnyjpmAA/gIG0Km1PQ6bx9UspqGZlkuqkHuS9Rt8QDdL7Bb/5k1nru8YyEAAAAASUVORK5CYII=",
      "sizes": "32x32",
      "type": "image/png"
    }
  ]
};

const manifestBlob = new Blob([JSON.stringify(manifest)], {type: 'application/json'});
const manifestURL = URL.createObjectURL(manifestBlob);
const link = document.createElement('link');
link.rel = 'manifest';
link.href = manifestURL;
document.head.appendChild(link);

// --------------------
// Inline Service Worker
// --------------------
const swCode = `
const CACHE_NAME = 'private-chat-pwa-v1';
const ASSETS = ['./'];

self.addEventListener('install', e => {
  e.waitUntil(
    caches.open(CACHE_NAME).then(cache => cache.addAll(ASSETS))
  );
});

self.addEventListener('fetch', e => {
  e.respondWith(caches.match(e.request).then(resp => resp || fetch(e.request)));
});
`;

if ('serviceWorker' in navigator) {
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl)
    .then(() => console.log('Service Worker Registered'))
    .catch(err => console.error('SW registration failed:', err));
}
</script>
</body>
</html>
