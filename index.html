<!DOCTYPE html>
<html>
<head>
  <title>Balaba Family 🥰🥰😍😍😘😘</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <style>
    html, body {
      margin:0; padding:0;
      width:100%; height:100%;
      font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display:flex; justify-content:center; align-items:center;
      overflow:hidden;
      background: linear-gradient(to top, #a1c4fd, #c2e9fb, #ffffff);
      position:relative;
    }

    /* Clouds */
    .cloud{position:absolute; background:rgba(255,255,255,0.8); border-radius:50%; opacity:0.7;
      box-shadow:0 10px 40px rgba(255,255,255,0.6); animation:floatClouds linear infinite;}
    .cloud1{width:200px;height:60px;top:10%;left:-250px;animation-duration:80s;}
    .cloud2{width:300px;height:80px;top:30%;left:-350px;animation-duration:100s;}
    .cloud3{width:150px;height:50px;top:60%;left:-200px;animation-duration:70s;}
    @keyframes floatClouds{0%{transform:translateX(0);}100%{transform:translateX(130vw);}}

    /* Glowing background & stars */
    body::before, body::after{content:"";position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;}
    body::before{background:radial-gradient(circle,rgba(255,255,255,0.2)0%,transparent 80%);animation:pulse 6s ease-in-out infinite;}
    body::after{background:radial-gradient(circle,rgba(255,255,255,0.05)1px,transparent 1px);background-size:20px 20px;animation:twinkle 5s infinite;}
    @keyframes pulse{0%,100%{opacity:0.3;}50%{opacity:0.6;}}
    @keyframes twinkle{0%,100%{opacity:0.3;}50%{opacity:0.6;}}

    /* Chat container */
    .chat-container{
      display:flex; flex-direction:column; width:95vw; height:95vh;
      max-width:800px; max-height:95vh;
      background:rgba(255,255,255,0.85); border-radius:40px; box-shadow:0 20px 60px rgba(0,0,0,0.25),0 0 80px rgba(255,255,255,0.4) inset;
      overflow:hidden; color:#333; backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.5); position:relative;
      animation:floatContainer 6s ease-in-out infinite;
    }
    @keyframes floatContainer{0%,100%{transform:translateY(0);}50%{transform:translateY(-8px);}}

    h2{text-align:center;padding:16px;margin:0;background:linear-gradient(to right,#a1c4fd,#c2e9fb);color:#1e88e5;
      border-top-left-radius:40px;border-top-right-radius:40px;font-size:2rem;text-shadow:2px 2px 12px rgba(255,255,255,0.8);
      box-shadow:inset 0 -1px 5px rgba(0,0,0,0.05);}

    /* Login form */
    #loginForm{display:flex; flex-direction:column;padding:18px;background:rgba(255,255,255,0.8);border-bottom:1px solid #ddd;backdrop-filter:blur(7px);}
    #loginForm input{padding:12px 14px;margin-bottom:12px;border-radius:30px;border:1px solid #ccc;font-size:1rem;transition:0.3s;box-shadow:0 4px 15px rgba(255,255,255,0.4) inset;}
    #loginForm input:focus{outline:none;border-color:#42a5f5;box-shadow:0 0 25px rgba(66,165,245,0.7),0 4px 15px rgba(255,255,255,0.5) inset;}
    #loginBtn,#logoutBtn{padding:14px;border:none;border-radius:30px;cursor:pointer;font-size:1rem;margin-bottom:8px;color:#fff;transition:0.3s;box-shadow:0 8px 25px rgba(0,0,0,0.2),0 0 40px rgba(255,255,255,0.3) inset;}
    #loginBtn{background:#42a5f5;}#loginBtn:hover{background:#1e88e5;}#logoutBtn{background:#ef5350;display:none;}#logoutBtn:hover{background:#e53935;}

    /* Chat messages */
    #chat{flex:1;list-style:none;padding:20px;margin:0;display:flex;flex-direction:column;overflow-y:auto;background:rgba(255,255,255,0.35);backdrop-filter:blur(12px);position:relative;}
    .message{max-width:75%;margin-bottom:14px;padding:12px 18px;border-radius:30px;word-wrap:break-word;display:inline-block;clear:both;font-size:1rem;opacity:0;transform:translateY(20px);transition:all 0.5s ease, box-shadow 0.5s ease;position:relative;box-shadow:0 8px 35px rgba(0,0,0,0.08),0 0 25px rgba(255,255,255,0.4) inset;
      background:linear-gradient(135deg,#ff9a9e,#fad0c4,#a1c4fd,#c2e9fb);background-size:400% 400%;animation:floatMessage 4s ease-in-out infinite,rainbowBG 8s ease infinite;}
    @keyframes floatMessage{0%,100%{transform:translateY(0);}50%{transform:translateY(-5px);}}
    @keyframes rainbowBG{0%{background-position:0% 50%;}50%{background-position:100% 50%;}100%{background-position:0% 50%;}}
    .message.show{opacity:1;transform:translateY(0);}
    .message.user{align-self:flex-end;border-bottom-right-radius:5px;}
    .message.other{align-self:flex-start;border-bottom-left-radius:5px;}

    .online-indicator{width:14px;height:14px;border-radius:50%;background:#00ff00;position:absolute;top:-7px;right:-7px;animation:blink 0.8s infinite;}
    @keyframes blink{0%,50%,100%{opacity:1;}25%,75%{opacity:0;}}
    .username{font-weight:bold;margin-bottom:4px;display:block;color:#1976d2;}
    .timestamp{font-size:0.75rem;color:#555;margin-top:3px;display:block;text-align:right;}

    /* Sparkles inside chat */
    .sparkle{position:absolute;width:6px;height:6px;background:radial-gradient(circle,#fff,rgba(255,255,255,0));border-radius:50%;pointer-events:none;animation:sparkleAnim linear infinite;box-shadow:0 0 10px #fff,0 0 15px #fff,0 0 25px #fffb;}
    @keyframes sparkleAnim{0%{transform:translateY(0) scale(0);opacity:1;}50%{transform:translateY(-25px) scale(1.3);opacity:0.9;}100%{transform:translateY(-50px) scale(0);opacity:0;}}

    /* Input form */
    #form{display:flex;padding:12px;border-top:1px solid #ccc;background:rgba(255,255,255,0.8);backdrop-filter:blur(7px);}
    #message{flex-grow:1;padding:14px;border-radius:30px;border:1px solid #ccc;margin-right:12px;font-size:1rem;transition:0.3s;box-shadow:0 4px 15px rgba(255,255,255,0.4) inset;}
    #message:focus{outline:none;border-color:#42a5f5;box-shadow:0 0 35px rgba(66,165,245,0.9),0 4px 15px rgba(255,255,255,0.5) inset;}
    #sendBtn{padding:14px 20px;border:none;background:#42a5f5;color:#fff;border-radius:30px;cursor:pointer;font-size:1rem;transition:0.3s;box-shadow:0 4px 15px rgba(66,165,245,0.5);}
    #sendBtn:hover{background:#1e88e5;}

    /* Mobile adjustments */
    @media(max-width:600px){
      .chat-container{width:98vw;height:98vh;border-radius:20px;}
      h2{font-size:1.5rem;padding:12px;}
      #loginForm input, #form input{font-size:0.9rem;padding:10px;}
      #loginBtn,#logoutBtn,#sendBtn{font-size:0.9rem;padding:12px;}
      .message{font-size:0.9rem;padding:10px 14px;}
    }
  </style>
</head>
<body>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<div class="chat-container">
  <h2>Balaba Family 🥰🥰😍😍😘😘</h2>
  <div id="loginForm">
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login / Set User</button>
    <button id="logoutBtn">Logout</button>
  </div>
  <ul id="chat"></ul>
  <div id="form" style="display:none;">
    <input id="message" placeholder="Type your message">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script src="https://tunnelling-website.onrender.com/socket.io/socket.io.js"></script>
<script>
const SERVER_URL="https://tunnelling-website.onrender.com";
const socket=io(SERVER_URL);
const chat=document.getElementById("chat");
const loginForm=document.getElementById("loginForm");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");
const usernameInput=document.getElementById("username");
const passwordInput=document.getElementById("password");
const formDiv=document.getElementById("form");
const messageInput=document.getElementById("message");
const sendBtn=document.getElementById("sendBtn");
let currentUser="";
let onlineUsersArr=[];
const SITE_PASSWORD="Freedom98";

(function askPassword(){
  let pw=prompt("Enter website password:");
  if(pw===null){ document.body.innerHTML="<h2 style='text-align:center;margin-top:50px;'>Access denied</h2>"; return; }
  if(pw!==SITE_PASSWORD){ alert("Incorrect password!"); askPassword(); }
})();

loginBtn.addEventListener("click", ()=>{
  const user=usernameInput.value.trim();
  const pass=passwordInput.value.trim();
  if(!user||!pass) return alert("Enter username and password!");
  localStorage.setItem("groupChatUser",user);
  localStorage.setItem("groupChatPass",pass);
  currentUser=user;
  loginForm.style.display="none";
  formDiv.style.display="flex";
  logoutBtn.style.display="block";
  socket.emit("login",currentUser);
});
logoutBtn.addEventListener("click", ()=>{
  localStorage.removeItem("groupChatUser");
  localStorage.removeItem("groupChatPass");
  currentUser="";
  loginForm.style.display="flex";
  formDiv.style.display="none";
  logoutBtn.style.display="none";
});

socket.on("loadMessages",messages=>messages.forEach(addMessage));
socket.on("chatMessage",addMessage);

socket.on("onlineUsers", users=>{
  onlineUsersArr=users;
  document.querySelectorAll(".message.other").forEach(msgEl=>{
    const username=msgEl.querySelector(".username")?.textContent;
    if(username && onlineUsersArr.includes(username)){
      if(!msgEl.querySelector(".online-indicator")){
        const indicator=document.createElement("div");
        indicator.classList.add("online-indicator");
        msgEl.appendChild(indicator);
      }
    } else {
      const indicator=msgEl.querySelector(".online-indicator");
      if(indicator) indicator.remove();
    }
  });
});

sendBtn.addEventListener("click", sendMessage);
messageInput.addEventListener("keyup", e=>{ if(e.key==='Enter') sendMessage(); });

function sendMessage(){
  const text=messageInput.value.trim();
  if(!currentUser||!text) return;
  const timestamp=new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  socket.emit("chatMessage",{user:currentUser,text,timestamp});
  messageInput.value="";
}

function addMessage(msg){
  const li=document.createElement("li");
  li.classList.add("message", msg.user===currentUser?"user":"other");
  if(msg.user!==currentUser){
    const usernameSpan=document.createElement("span");
    usernameSpan.classList.add("username");
    usernameSpan.textContent=msg.user;
    li.appendChild(usernameSpan);
    if(onlineUsersArr.includes(msg.user)){
      const indicator=document.createElement("div");
      indicator.classList.add("online-indicator");
      li.appendChild(indicator);
    }
  }
  const textSpan=document.createElement("span");
  textSpan.textContent=msg.text;
  li.appendChild(textSpan);

  const timeSpan=document.createElement("span");
  timeSpan.classList.add("timestamp");
  timeSpan.textContent=msg.timestamp || new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  li.appendChild(timeSpan);

  chat.appendChild(li);
  chat.scrollTop=chat.scrollHeight;

  setTimeout(()=>{
    li.classList.add("show");
    for(let i=0;i<12;i++){
      const sparkle=document.createElement("div");
      sparkle.className="sparkle";
      sparkle.style.left=Math.random()*80+"%";
      sparkle.style.top=Math.random()*50+"%";
      chat.appendChild(sparkle);
      setTimeout(()=>sparkle.remove(), 3500);
    }
  },10);
}

const savedUser=localStorage.getItem("groupChatUser");
if(savedUser){
  currentUser=savedUser;
  loginForm.style.display="none";
  formDiv.style.display="flex";
  logoutBtn.style.display="block";
  socket.emit("login",currentUser);
}
</script>
</body>
</html>
