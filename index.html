<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FPS Auto-Lock PWA</title>

<!-- PWA manifest inlined -->
<link rel="manifest" href="data:application/manifest+json,{
  &quot;name&quot;: &quot;FPS Auto-Lock&quot;,
  &quot;short_name&quot;: &quot;AutoLock&quot;,
  &quot;start_url&quot;: &quot;./index.html&quot;,
  &quot;display&quot;: &quot;standalone&quot;,
  &quot;background_color&quot;: &quot;#000000&quot;,
  &quot;theme_color&quot;: &quot;#0f0&quot;
}">

<style>
  /* ===== CSS ===== */
  body { margin:0; background:#000; color:#0f0; font-family:Arial,sans-serif; overflow:hidden; }
  #hud { position:fixed; top:10px; left:10px; font-size:14px; }
  #staminaBox { position:fixed; bottom:20px; left:50%; transform:translateX(-50%); width:200px; height:12px; border:1px solid #0f0; }
  #stamina { height:100%; background:#0f0; }
  canvas { display:block; }
</style>
</head>
<body>

<div id="hud"></div>
<div id="staminaBox"><div id="stamina"></div></div>
<canvas id="game"></canvas>

<script>
/* ===== JS ===== */
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth; canvas.height = innerHeight;

let keys = {}, time = 0;
let cx = canvas.width/2, cy = canvas.height/2;

const player = {
  x: canvas.width/2, y: canvas.height/2,
  vx:0, vy:0, accel:0.4, friction:0.85,
  walk:2.5, run:6, stamina:100, state:"IDLE"
};

const enemy = { x:300, y:200, vx:1, vy:1, state:"PATROL", alive:true };

window.addEventListener("keydown", e=>keys[e.key]=true);
window.addEventListener("keyup", e=>keys[e.key]=false);

/* ===== PWA Service Worker ===== */
if ('serviceWorker' in navigator){
  navigator.serviceWorker.register(URL.createObjectURL(new Blob([`
    const CACHE_NAME='fps-autolock-cache-v1';
    const FILES_TO_CACHE=['./index.html'];
    self.addEventListener('install', evt => { evt.waitUntil(caches.open(CACHE_NAME).then(c=>c.addAll(FILES_TO_CACHE))); self.skipWaiting(); });
    self.addEventListener('activate', evt => { evt.waitUntil(self.clients.claim()); });
    self.addEventListener('fetch', evt => { evt.respondWith(caches.match(evt.request).then(r=>r||fetch(evt.request))); });
  `],{type:'text/javascript'}))).then(()=>console.log('SW registered'));
}

/* ===== Game Logic ===== */
function update(dt){
  let moving=false;
  if(keys.w||keys.ArrowUp){player.vy-=player.accel;moving=true;}
  if(keys.s||keys.ArrowDown){player.vy+=player.accel;moving=true;}
  if(keys.a||keys.ArrowLeft){player.vx-=player.accel;moving=true;}
  if(keys.d||keys.ArrowRight){player.vx+=player.accel;moving=true;}

  let sprint = keys.Shift && player.stamina>0 && moving;
  let max = sprint ? player.run : player.walk;

  player.stamina += sprint?-0.4:0.2;
  player.stamina = Math.max(0, Math.min(100, player.stamina));

  player.vx = Math.max(-max, Math.min(max, player.vx));
  player.vy = Math.max(-max, Math.min(max, player.vy));
  player.x += player.vx; player.y += player.vy;
  player.vx *= player.friction; player.vy *= player.friction;

  player.x = Math.max(0, Math.min(canvas.width, player.x));
  player.y = Math.max(0, Math.min(canvas.height, player.y));

  let speed = Math.hypot(player.vx, player.vy);
  player.state = speed<0.3?"IDLE":(sprint?"SPRINTING":"WALKING");

  let dist = Math.hypot(player.x - enemy.x, player.y - enemy.y);
  if(enemy.alive){
    if(dist<220 && player.state==="SPRINTING") enemy.state="CHASE";
    if(enemy.state==="PATROL"){enemy.x+=enemy.vx; enemy.y+=enemy.vy; if(Math.random()<0.01){enemy.vx*=-1; enemy.vy*=-1;}}
    else {enemy.x+=(player.x-enemy.x)*0.02; enemy.y+=(player.y-enemy.y)*0.02;}
  }

  if(enemy.alive){
    let dx = enemy.x - player.x; let dy = enemy.y - player.y;
    cx += (dx - cx)/15; cy += (dy - cy)/15;
  }

  document.getElementById("hud").innerHTML =
    \`PLAYER: \${player.state}<br>ENEMY: \${enemy.alive?enemy.state:"DOWN"}<br>AUTO-LOCK: \${enemy.alive?"ON":"OFF"}\`;
  document.getElementById("stamina").style.width = player.stamina+"%";
}

function drawCrosshair(){
  ctx.strokeStyle="#0f0"; ctx.beginPath();
  let size = (player.state==="SPRINTING"?18:10);
  ctx.moveTo(cx-size,cy); ctx.lineTo(cx-3,cy);
  ctx.moveTo(cx+3,cy); ctx.lineTo(cx+size,cy);
  ctx.moveTo(cx,cy-size); ctx.lineTo(cx,cy-3);
  ctx.moveTo(cx,cy+3); ctx.lineTo(cx,cy+size);
  ctx.stroke();
}

function drawWeapon(){ ctx.fillStyle="#444"; ctx.fillRect(cx+30, canvas.height-90, 160, 45); }

function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(enemy.alive){ctx.fillStyle=enemy.state==="CHASE"?"red":"#555"; ctx.fillRect(enemy.x-15, enemy.y-15,30,30);}
  drawCrosshair(); drawWeapon();
}

let last = performance.now();
function loop(t){ time+=t-last; let dt=t-last; last=t; update(dt); draw(); requestAnimationFrame(loop);}
loop(last);
</script>

</body>
</html>
