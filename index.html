<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Private Chat PWA</title>

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">

<style>
  html, body {
    margin:0;
    padding:0;
    height:100%;
    background:#000;
    overflow:hidden;
    font-family:Arial, sans-serif;
    color:#0f0;
  }
  iframe {
    width:100%;
    height:100%;
    border:none;
    background:#000;
  }
  #loading {
    position:fixed;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    color:#00ffcc;
    z-index:10;
    background:#000;
  }
  #motionBtn {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    padding: 10px 20px;
    background:#00ffcc;
    color:#000;
    border:none;
    border-radius:5px;
    font-weight:bold;
    cursor:pointer;
    z-index:11;
  }
  /* Overlay for countdown and notices */
  #overlay {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:9999; /* always on top */
    pointer-events:none; /* allows clicks to pass through iframe */
  }
  #countdown {
    position: absolute;
    top:10px;
    right:10px;
    font-size:32px;
    font-weight:bold;
    color:#00ffcc;
    background: rgba(0,0,0,0.5);
    padding:5px 10px;
    border-radius:5px;
    display:none; /* hidden until started */
  }
  #fullscreenNotice {
    position: absolute;
    bottom:60px;
    left:50%;
    transform: translateX(-50%);
    color:#f00;
    font-weight:bold;
    display:none;
  }
</style>

<!-- AUTO-GENERATE BLACK ICONS -->
<script>
function generateIcons() {
  const sizes = [192, 512];
  sizes.forEach(size => {
    const canvas = document.createElement('canvas');
    canvas.width = size;
    canvas.height = size;
    const ctx = canvas.getContext('2d');

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, size, size);

    const dataURL = canvas.toDataURL('image/png');

    const link = document.createElement('link');
    link.rel = 'icon';
    link.sizes = `${size}x${size}`;
    link.href = dataURL;
    document.head.appendChild(link);
  });
}
generateIcons();
</script>

</head>
<body>

<div id="loading">Launching Private Chat…</div>

<!-- Overlay container -->
<div id="overlay">
  <div id="countdown">00:00:00</div>
  <div id="fullscreenNotice">You are not in full screen!</div>
</div>

<iframe src="https://private-chat-sage-zeta.vercel.app/" 
  onload="document.getElementById('loading').style.display='none';"></iframe>

<button id="motionBtn">Start Screen Motion Monitor</button>

<script>
  // -------------------------
  // Service Worker
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }

  // -------------------------
  // Fullscreen detection
  const fsNotice = document.getElementById('fullscreenNotice');
  function checkFullscreen() {
    if (!document.fullscreenElement) {
      fsNotice.style.display = 'block';
    } else {
      fsNotice.style.display = 'none';
    }
  }
  setInterval(checkFullscreen, 500);

  document.body.addEventListener('click', () => {
    if(!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(()=>{});
    }
  });

  // -------------------------
  // Motion Detection + Countdown Timer
  const motionBtn = document.getElementById('motionBtn');
  const countdownEl = document.getElementById('countdown');
  let timerInterval = null;
  let secondsPassed = 0;
  let motionActive = false;

  motionBtn.onclick = async () => {
    if(motionActive){
      // Stop monitoring
      motionActive = false;
      clearInterval(timerInterval);
      countdownEl.style.display = 'none';
      motionBtn.textContent = "Start Screen Motion Monitor";
      return;
    }

    // Start monitoring
    motionActive = true;
    countdownEl.style.display = 'block';
    motionBtn.textContent = "Stop Screen Motion Monitor";

    // Start timer
    timerInterval = setInterval(() => {
      secondsPassed++;
      const hrs = Math.floor(secondsPassed/3600).toString().padStart(2,'0');
      const mins = Math.floor((secondsPassed%3600)/60).toString().padStart(2,'0');
      const secs = (secondsPassed%60).toString().padStart(2,'0');
      countdownEl.textContent = `${hrs}:${mins}:${secs}`;
    }, 1000);

    // Screen motion detection (pseudo-monitor)
    try {
      const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
      const video = document.createElement('video');
      video.srcObject = stream;
      video.play();

      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      let lastFrame = null;

      function checkMotion() {
        if(!motionActive) return; // stop if monitoring stopped
        if(video.videoWidth === 0) return requestAnimationFrame(checkMotion);

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        const frame = ctx.getImageData(0,0,canvas.width,canvas.height);

        if(lastFrame){
          let diff = 0;
          for(let i=0;i<frame.data.length;i+=4){
            diff += Math.abs(frame.data[i] - lastFrame.data[i]);
            diff += Math.abs(frame.data[i+1] - lastFrame.data[i+1]);
            diff += Math.abs(frame.data[i+2] - lastFrame.data[i+2]);
          }
          if(diff > 1000000){
            console.log('Motion detected!');
            // Auto-lock or custom logic goes here
          }
        }
        lastFrame = frame;
        requestAnimationFrame(checkMotion);
      }

      checkMotion();
    } catch(err){
      console.error('Screen capture failed:', err);
    }
  };
</script>

</body>
</html>
