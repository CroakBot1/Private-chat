<!DOCTYPE html>
<html>
<head>
  <title>Secure Group Chat</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #e6ecf0;
      display: flex;
      justify-content: center;
      padding: 20px;
    }

    .chat-container {
      width: 100%;
      max-width: 600px;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      height: 80vh;
      overflow: hidden;
    }

    h2 {
      text-align: center;
      padding: 15px;
      margin: 0;
      background: #4a76a8;
      color: #fff;
      border-top-left-radius: 10px;
      border-top-right-radius: 10px;
      font-size: 1.5rem;
    }

    #chat {
      list-style: none;
      padding: 15px;
      margin: 0;
      flex-grow: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .message {
      max-width: 70%;
      margin-bottom: 10px;
      padding: 10px 15px;
      border-radius: 20px;
      word-wrap: break-word;
      position: relative;
      display: inline-block;
      clear: both;
      font-size: 0.95rem;
    }

    .message.user {
      background: #dcf8c6;
      align-self: flex-end;
      border-bottom-right-radius: 0;
    }

    .message.other {
      background: #eee;
      align-self: flex-start;
      border-bottom-left-radius: 0;
    }

    .username {
      font-weight: bold;
      display: block;
      margin-bottom: 3px;
    }

    .timestamp {
      font-size: 0.7rem;
      color: #666;
      margin-top: 3px;
      display: block;
      text-align: right;
    }

    #loginForm {
      display: flex;
      flex-direction: column;
      padding: 10px;
      background: #fafafa;
      border-bottom: 1px solid #ddd;
    }

    #loginForm input {
      padding: 8px;
      margin-bottom: 5px;
      border-radius: 20px;
      border: 1px solid #ccc;
    }

    #loginBtn {
      padding: 8px 16px;
      border: none;
      background: #4a76a8;
      color: #fff;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    #loginBtn:hover {
      background: #3b5f87;
    }

    #form {
      display: flex;
      padding: 10px;
      border-top: 1px solid #ddd;
      background: #fafafa;
    }

    #message {
      flex-grow: 1;
      padding: 8px;
      margin-right: 5px;
      border-radius: 20px;
      border: 1px solid #ccc;
    }

    #sendBtn {
      padding: 8px 16px;
      border: none;
      background: #4a76a8;
      color: #fff;
      border-radius: 20px;
      cursor: pointer;
      transition: 0.2s;
    }

    #sendBtn:hover {
      background: #3b5f87;
    }
  </style>
</head>
<body>

<div class="chat-container">
  <h2>Secure Group Chat</h2>

  <div id="loginForm">
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login / Set User</button>
  </div>

  <ul id="chat"></ul>

  <div id="form" style="display:none;">
    <input id="message" placeholder="Type your message">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script src="https://tunnelling-website.onrender.com/socket.io/socket.io.js"></script>
<script>
const socket = io("https://tunnelling-website.onrender.com");
const chat = document.getElementById("chat");
const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const formDiv = document.getElementById("form");
const messageInput = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");

let currentUser = "";

// Check if user already set on this device
const savedUser = localStorage.getItem("groupChatUser");
const savedPass = localStorage.getItem("groupChatPass");

if(savedUser && savedPass){
  currentUser = savedUser;
  loginForm.style.display = "none";
  formDiv.style.display = "flex";
}

// Login / set username with password
loginBtn.addEventListener("click", () => {
  const user = usernameInput.value.trim();
  const pass = passwordInput.value.trim();
  if(!user || !pass){
    alert("Please enter username and password!");
    return;
  }

  // Save to localStorage so only one user per device
  localStorage.setItem("groupChatUser", user);
  localStorage.setItem("groupChatPass", pass);
  currentUser = user;

  loginForm.style.display = "none";
  formDiv.style.display = "flex";
});

// Load previous messages
socket.on("loadMessages", (messages) => {
  messages.forEach(msg => addMessage(msg));
});

// Receive new message
socket.on("chatMessage", addMessage);

// Send message on button click
sendBtn.addEventListener("click", sendMessage);

// Send message on Enter key
messageInput.addEventListener("keyup", (e) => {
  if(e.key === "Enter") sendMessage();
});

function sendMessage() {
  const text = messageInput.value.trim();
  if(!currentUser || !text) return;

  const timestamp = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  socket.emit("chatMessage", {user: currentUser, text, timestamp});
  messageInput.value = "";
}

function addMessage(msg) {
  const li = document.createElement("li");
  li.classList.add("message");
  li.classList.add(msg.user === currentUser ? "user" : "other");

  const usernameSpan = document.createElement("span");
  usernameSpan.classList.add("username");
  usernameSpan.textContent = msg.user;
  li.appendChild(usernameSpan);

  const textSpan = document.createElement("span");
  textSpan.textContent = msg.text;
  li.appendChild(textSpan);

  const timeSpan = document.createElement("span");
  timeSpan.classList.add("timestamp");
  timeSpan.textContent = msg.timestamp || new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
  li.appendChild(timeSpan);

  chat.appendChild(li);
  chat.scrollTop = chat.scrollHeight;
}
</script>

</body>
</html>
