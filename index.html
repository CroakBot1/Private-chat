<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultimate PWA App</title>

<!-- Manifest -->
<link rel="manifest" href="manifest.json">

<!-- Inline CSS -->
<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 50px;
  background-color: #f0f0f0;
  color: #333;
  transition: background-color 0.3s, color 0.3s;
}
.container {
  max-width: 500px;
  margin: auto;
}
button {
  padding: 10px 20px;
  font-size: 18px;
  margin: 10px;
  cursor: pointer;
  border: none;
  border-radius: 5px;
  background-color: #4CAF50;
  color: white;
  transition: background-color 0.3s;
}
button:hover {
  background-color: #45a049;
}
.dark-mode {
  background-color: #121212;
  color: #f0f0f0;
}
</style>
</head>
<body>
<div class="container">
  <h1>Ultimate PWA App!</h1>
  <button id="clickBtn">Click Me</button>
  <button id="darkModeBtn">Toggle Dark Mode</button>
  <p id="status">App is fully offline!</p>
</div>

<!-- Inline JS -->
<script>
// Button click
document.getElementById('clickBtn').addEventListener('click', () => {
  alert('Hello! This works offline!');
});

// Dark mode toggle
document.getElementById('darkModeBtn').addEventListener('click', () => {
  document.body.classList.toggle('dark-mode');
  const status = document.getElementById('status');
  status.textContent = document.body.classList.contains('dark-mode') ? 
    'Dark Mode ON' : 'Dark Mode OFF';
});

// Inline Service Worker
const swCode = `
const CACHE_NAME = 'ultimate-pwa-cache-v1';
const ASSETS = ['./','./index.html','./manifest.json','./icon.png'];

self.addEventListener('install', e => {
  e.waitUntil(
    caches.open(CACHE_NAME).then(cache => cache.addAll(ASSETS))
  );
});
self.addEventListener('fetch', e => {
  e.respondWith(caches.match(e.request).then(resp => resp || fetch(e.request)));
});
`;

// Register inline service worker
if ('serviceWorker' in navigator) {
  const blob = new Blob([swCode], { type: 'application/javascript' });
  const swUrl = URL.createObjectURL(blob);
  navigator.serviceWorker.register(swUrl)
    .then(() => console.log('Service Worker Registered'))
    .catch(err => console.error('SW registration failed:', err));
}
</script>
</body>
</html>
