<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Private Chat PWA</title>
<link rel="manifest" href="manifest.json">
<style>
body { font-family: Arial; text-align:center; margin:50px; background:#f0f0f0; }
button { padding:10px 20px; font-size:18px; margin:10px; cursor:pointer; border:none; border-radius:5px; background:#4CAF50; color:white; }
button:hover { background:#45a049; }
#installBtn { display:none; }
</style>
</head>
<body>
<h1>Private Chat PWA</h1>
<button id="clickBtn">Click Me</button>
<button id="darkModeBtn">Toggle Dark Mode</button>
<button id="installBtn">Install App</button>
<p id="status">App is fully offline!</p>

<script>
// Dark mode toggle
document.getElementById('darkModeBtn').addEventListener('click', () => {
  document.body.classList.toggle('dark-mode');
  document.getElementById('status').textContent = document.body.classList.contains('dark-mode') ? 'Dark Mode ON' : 'Dark Mode OFF';
});

// Click button
document.getElementById('clickBtn').addEventListener('click', () => alert('Hello! This works offline!'));

// Install button
let deferredPrompt;
const installBtn = document.getElementById('installBtn');
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredPrompt = e;
  installBtn.style.display = 'inline-block';
});
installBtn.addEventListener('click', async () => {
  installBtn.style.display = 'none';
  if (deferredPrompt) {
    deferredPrompt.prompt();
    deferredPrompt.userChoice.then(choiceResult => {
      console.log('User choice: ', choiceResult.outcome);
      deferredPrompt = null;
    });
  }
});

// Register Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => console.log('Service Worker Registered'))
    .catch(err => console.error('SW registration failed:', err));
}
</script>
</body>
</html>
