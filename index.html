<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Balaba Family 🥰🥰😍😍😘😘</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<!-- PWA BASIC -->
<meta name="theme-color" content="#42a5f5">
<link rel="manifest" href="manifest.json">
<link rel="icon" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">

<style>
/* ===== GLOBAL ===== */
html,body{
  margin:0;padding:0;width:100%;height:100%;
  font-family:'Segoe UI',sans-serif;
  display:flex;justify-content:center;align-items:center;
  background:linear-gradient(to top,#a1c4fd,#c2e9fb,#fff);
  overflow:hidden;
}

/* ===== CLOUDS ===== */
.cloud{position:absolute;background:rgba(255,255,255,.8);border-radius:50%;opacity:.7;
box-shadow:0 10px 40px rgba(255,255,255,.6);animation:floatClouds linear infinite}
.cloud1{width:200px;height:60px;top:10%;left:-250px;animation-duration:80s}
.cloud2{width:300px;height:80px;top:30%;left:-350px;animation-duration:100s}
.cloud3{width:150px;height:50px;top:60%;left:-200px;animation-duration:70s}
@keyframes floatClouds{to{transform:translateX(130vw)}}

/* ===== CONTAINER ===== */
.chat-container{
  width:95vw;height:95vh;max-width:800px;
  background:rgba(255,255,255,.88);
  border-radius:40px;
  display:flex;flex-direction:column;
  box-shadow:0 20px 60px rgba(0,0,0,.25);
  overflow:hidden;
}

/* ===== HEADER ===== */
h2{
  margin:0;padding:16px;text-align:center;
  background:linear-gradient(to right,#a1c4fd,#c2e9fb);
  color:#1e88e5;font-size:2rem;
}

/* ===== LOGIN ===== */
#loginForm{padding:18px;background:#fff}
#loginForm input{
  width:100%;padding:12px;margin-bottom:10px;
  border-radius:30px;border:1px solid #ccc
}
#loginBtn,#logoutBtn{
  width:100%;padding:14px;border:none;
  border-radius:30px;color:#fff;
  font-size:1rem;cursor:pointer
}
#loginBtn{background:#42a5f5}
#logoutBtn{background:#ef5350;display:none}

/* ===== CHAT ===== */
#chat{
  flex:1;list-style:none;padding:20px;margin:0;
  overflow-y:auto;display:flex;flex-direction:column
}
.message{
  max-width:75%;padding:12px 18px;
  border-radius:30px;margin-bottom:12px;
  background:linear-gradient(135deg,#ff9a9e,#a1c4fd);
  animation:fade .3s ease forwards;
  position:relative
}
.user{align-self:flex-end;border-bottom-right-radius:5px}
.other{align-self:flex-start;border-bottom-left-radius:5px}
.timestamp{
  display:block;font-size:.65rem;
  text-align:right;margin-top:4px
}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1}}

/* ===== ONLINE DOT ===== */
.online-indicator{
  width:10px;height:10px;background:#00ff00;
  border-radius:50%;position:absolute;
  top:-5px;right:-5px;
  animation:blink .8s infinite
}
@keyframes blink{50%{opacity:.3}}

/* ===== INPUT ===== */
#form{display:none;padding:12px;background:#fff}
#message{
  flex:1;padding:12px;border-radius:30px;
  border:1px solid #ccc;margin-right:10px
}
#sendBtn{
  padding:12px 18px;border:none;
  border-radius:30px;background:#42a5f5;
  color:#fff;cursor:pointer
}
</style>
</head>

<body>

<div class="cloud cloud1"></div>
<div class="cloud cloud2"></div>
<div class="cloud cloud3"></div>

<div class="chat-container">
  <h2>Balaba Family 🥰🥰😍😍😘😘</h2>

  <div id="loginForm">
    <input id="username" placeholder="Username">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">Login</button>
    <button id="logoutBtn">Logout</button>
  </div>

  <ul id="chat"></ul>

  <div id="form">
    <input id="message" placeholder="Type message">
    <button id="sendBtn">Send</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io();
const chat=document.getElementById("chat");
const loginForm=document.getElementById("loginForm");
const form=document.getElementById("form");
const loginBtn=document.getElementById("loginBtn");
const logoutBtn=document.getElementById("logoutBtn");
const usernameInput=document.getElementById("username");
const passwordInput=document.getElementById("password");
const messageInput=document.getElementById("message");
const sendBtn=document.getElementById("sendBtn");

let currentUser="";
const SITE_PASSWORD="Freedom98";

/* ===== SITE PASSWORD ===== */
(function protect(){
  let pw=prompt("Enter website password:");
  if(pw!==SITE_PASSWORD){
    alert("Access denied");
    protect();
  }
})();

/* ===== LOGIN ===== */
loginBtn.onclick=()=>{
  if(!usernameInput.value||!passwordInput.value)
    return alert("Fill all fields");
  currentUser=usernameInput.value.trim();
  localStorage.setItem("chatUser",currentUser);
  loginForm.style.display="none";
  form.style.display="flex";
  logoutBtn.style.display="block";
  socket.emit("login",currentUser);
};

logoutBtn.onclick=()=>{
  localStorage.clear();
  location.reload();
};

/* ===== SEND ===== */
sendBtn.onclick=sendMessage;
messageInput.onkeyup=e=>{if(e.key==="Enter")sendMessage()};

function sendMessage(){
  if(!messageInput.value)return;
  socket.emit("chatMessage",{
    user:currentUser,
    text:messageInput.value,
    timestamp:new Date().toLocaleTimeString([],{
      hour:'2-digit',minute:'2-digit'
    })
  });
  messageInput.value="";
}

/* ===== RECEIVE ===== */
socket.on("loadMessages",msgs=>msgs.forEach(addMessage));
socket.on("chatMessage",addMessage);

function addMessage(msg){
  const li=document.createElement("li");
  li.className="message "+(msg.user===currentUser?"user":"other");
  li.innerHTML=`${msg.text}<span class="timestamp">${msg.timestamp}</span>`;
  chat.appendChild(li);
  li.scrollIntoView({behavior:"smooth"});
}

/* ===== AUTO LOGIN ===== */
const saved=localStorage.getItem("chatUser");
if(saved){
  currentUser=saved;
  loginForm.style.display="none";
  form.style.display="flex";
  logoutBtn.style.display="block";
  socket.emit("login",currentUser);
}

/* ===== SERVICE WORKER ===== */
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
</body>
</html>
